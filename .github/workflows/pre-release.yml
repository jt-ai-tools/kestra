name: Pre Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip-test:
        description: 'Skip test'
        type: choice
        required: true
        default: 'false'
        options:
          - "true"
          - "false"

jobs:
  build-artifacts:
    name: Build Artifacts
    uses: ./.github/workflows/fork-build-artifacts.yml
    secrets:
      OTLP_ENDPOINT: "${{ github.repository == 'kestra-io/kestra' && (secrets.OTLP_ENDPOINT) || '' }}"
      OTLP_HEADERS: "${{ github.repository == 'kestra-io/kestra' && (secrets.OTLP_HEADERS) || '' }}"
      GCP_SERVICE_ACCOUNT: "${{ github.repository == 'kestra-io/kestra' && (secrets.GCP_SERVICE_ACCOUNT) || '' }}"
    with:
      java-version: 25
      # Embed the plugin schema bundle in the jar, so the zip/tar and executable published
      # to the GitHub release carry it just like the Docker images do.
      embed-plugins-schema-bundle: "${{ github.repository == 'kestra-io/kestra' }}"

  backend-tests:
    name: Backend tests
    uses: ./.github/workflows/fork-backend-tests.yml
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: "${{ github.repository == 'kestra-io/kestra' && (secrets.GOOGLE_SERVICE_ACCOUNT) || '' }}"
    with:
      java-version: 25

  frontend-tests:
    name: Frontend tests
    uses: ./.github/workflows/fork-frontend-tests.yml
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  design-system-frontend-tests:
    name: Design System Frontend tests
    uses: ./.github/workflows/fork-designsystem-tests.yml
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven:
    name: Publish Maven
    needs: [ backend-tests, frontend-tests, design-system-frontend-tests ]
    if: "${{ github.repository == 'kestra-io/kestra' && (!failure() && !cancelled()) }}"
    uses: kestra-io/actions/.github/workflows/kestra-oss-publish-maven.yml@176fd1157db8717e1a7df8b0090fdabf534433f3
    secrets:
      SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SONATYPE_GPG_KEYID: ${{ secrets.SONATYPE_GPG_KEYID }}
      SONATYPE_GPG_PASSWORD: ${{ secrets.SONATYPE_GPG_PASSWORD }}
      SONATYPE_GPG_FILE: ${{ secrets.SONATYPE_GPG_FILE }}
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}
    with:
      java-version: 25

  generate-configuration-schema:
    name: Generate Configuration Schema
    needs: [build-artifacts]
    if: "${{ github.repository == 'kestra-io/kestra' && (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')) }}"
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Download executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exe
          path: build/executable

      - name: Prepare executable
        run: cp build/executable/* build/executable/kestra && chmod +x build/executable/kestra

      - name: Generate and publish schema
        uses: kestra-io/actions/composite/kestra/kestra-configuration-schema@176fd1157db8717e1a7df8b0090fdabf534433f3
        with:
          kestra-version: ${{ github.ref_name }}
          executable-path: build/executable/kestra
          output-path: oss.json
          gcs-destination: kestra-api-storage_prd/configuration-schema/${{ github.ref_name }}/
          gcp-credentials-json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Slack - Schema generation failure
        if: failure()
        uses: kestra-io/actions/composite/slack-status@176fd1157db8717e1a7df8b0090fdabf534433f3
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: 'C09FF36GKE1'

  publish-github:
    name: Github Release
    needs: [build-artifacts, backend-tests, frontend-tests]
    if: "${{ github.repository == 'kestra-io/kestra' && (!failure() && !cancelled()) }}"
    uses: kestra-io/actions/.github/workflows/kestra-oss-publish-github.yml@176fd1157db8717e1a7df8b0090fdabf534433f3
    secrets: inherit

  otel-export-trace:
    name: OpenTelemetry - Export Trace
    runs-on: ubuntu-latest
    if: "${{ github.repository == 'kestra-io/kestra' && (always()) }}"
    needs: [ build-artifacts, backend-tests, frontend-tests, design-system-frontend-tests, publish-maven, generate-configuration-schema, publish-github ]
    env:
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
    steps:
      - name: OpenTelemetry - Export trace
        uses: kestra-io/actions/actions/otel-export-trace@176fd1157db8717e1a7df8b0090fdabf534433f3
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          mode: export-all
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          logs-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
