name: Publish docker

on:
  workflow_dispatch:
    inputs:
      retag-latest:
        description: 'Retag latest Docker images'
        required: true
        type: boolean
        default: false
      retag-lts:
        description: 'Retag LTS Docker images'
        required: true
        type: boolean
        default: false
      dry-run:
        description: 'Dry run mode that will not write or release anything'
        required: true
        type: boolean
        default: false
      java-version:
        description: "Java version"
        type: string
        default: '25'
        required: false

jobs:
  publish-docker:
    name: Publish Docker
    if: "${{ github.repository == 'kestra-io/kestra' && (startsWith(github.ref, 'refs/tags/v')) }}"
    uses: kestra-io/actions/.github/workflows/kestra-oss-publish-docker.yml@176fd1157db8717e1a7df8b0090fdabf534433f3
    with:
      embed-plugins-schema-bundle: true
      retag-latest: ${{ inputs.retag-latest }}
      retag-lts: ${{ inputs.retag-lts }}
      dry-run: ${{ inputs.dry-run }}
      java-version: ${{ inputs.java-version }}
      use-kestra-base-images: true
    secrets: inherit

  helm-release:
    name: Helm release
    needs: publish-docker
    if: "${{ github.repository == 'kestra-io/kestra' && (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')) }}"
    permissions:
      contents: read
      id-token: write
    uses: kestra-io/actions/.github/workflows/kestra-oss-helm-release.yml@176fd1157db8717e1a7df8b0090fdabf534433f3
    with:
      dry-run: ${{ inputs.dry-run }}

  otel-export-trace:
    name: OpenTelemetry - Export Trace
    runs-on: ubuntu-latest
    if: "${{ github.repository == 'kestra-io/kestra' && (always()) }}"
    needs: [ publish-docker, helm-release ]
    env:
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
    steps:
      - name: OpenTelemetry - Export trace
        uses: kestra-io/actions/actions/otel-export-trace@176fd1157db8717e1a7df8b0090fdabf534433f3
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          mode: export-all
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          logs-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
