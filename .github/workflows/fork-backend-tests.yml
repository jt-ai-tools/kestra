# Vendored from kestra-io/actions@176fd1157db8717e1a7df8b0090fdabf534433f3; see ../FORK_CI_GUARDS.md.
name: Backend - Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: 'Deprecated, unused. Kept so callers still passing it do not fail.'
        required: false
      SONAR_TOKEN:
        description: 'Deprecated, unused. Kept so callers still passing it do not fail.'
        required: false
      GITHUB_AUTH_TOKEN:
        description: "The GitHub Token."
        required: true
      GOOGLE_SERVICE_ACCOUNT:
        description: 'Google Service Account'
        required: true
      DEVELOCITY_ACCESS_KEY:
        required: false
      OTLP_ENDPOINT:
        description: 'OTLP endpoint for OpenTelemetry export'
        required: false
      OTLP_HEADERS:
        description: 'OTLP headers for OpenTelemetry export'
        required: false
    inputs:
      java-version:
        description: "Java version"
        type: string
        default: '21'
        required: false

permissions:
  {"contents": "read"}
env:
  OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}

jobs:
  test:
    name: Backend - Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      # Run first, before checkout, so setup time is captured by the trace/host metrics.
      - name: Setup - OpenTelemetry
        uses: kestra-io/actions/actions/otel-instrument@176fd1157db8717e1a7df8b0090fdabf534433f3
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          host-metrics-enabled: 'true'
          gradle-tracing-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout - Current ref
        with:
          fetch-depth: 0

      # Services - start async. Was previously two steps (a detached `up -d` here, then a second
      # `up -d --wait` below once other setup finished) to fake overlap; `background:` + `wait:`
      # expresses that directly and surfaces a compose failure at the wait, with its own log,
      # instead of silently deferring it.
      - name: Setup - Start docker compose
        id: compose
        background: true
        shell: bash
        run: docker compose -f docker-compose-ci.yml up -d --wait --wait-timeout 120

      # Setup build
      - uses: kestra-io/actions/composite/setup-build@176fd1157db8717e1a7df8b0090fdabf534433f3
        name: Setup - Build
        id: build
        with:
          java-enabled: true
          node-enabled: true
          python-enabled: true
          java-version: ${{ inputs.java-version }}

      # Gradle: javadoc and check run as two separate steps, mirroring kestra-ee-backend-tests.yml.
      # javadoc runs first, before the docker-compose wait below, so it overlaps with container
      # startup instead of blocking behind it. testClasses is compiled here too, both so `check`
      # right after reuses already-compiled classes (compileJava/compileTestJava UP-TO-DATE, no
      # double compilation) and so the test-scheduling plugin has classes to schedule from:
      # https://github.com/kestra-io/gradle-plugin/#test-scheduling
      - name: Gradle - javadoc
        if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
        shell: bash
        run: |
          ./gradlew javadoc testClasses --parallel --console=plain

      # Services - wait to be ready
      - name: Setup - Wait docker compose
        wait: [compose]

      # Gradle check
      - name: Gradle - check
        if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
        shell: bash
        run: |
          ./gradlew check --parallel --console=plain

      # OpenGrep static analysis: pull requests scan only what the branch introduced, every other
      # event scans the whole tree. Advisory by default, see composite/scan-opengrep.
      - name: OpenGrep - Static analysis
        id: opengrep
        if: ${{ !cancelled() }}
        uses: ./.github/actions/fork-scan-opengrep
        with:
          github-token: ${{ secrets.GITHUB_AUTH_TOKEN }}
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            service.name=kestra
            component=backend

      # Secret scan. Diff on a pull request, the whole tree otherwise.
      - name: TruffleHog - Secret scan
        if: ${{ !cancelled() }}
        uses: ./.github/actions/fork-scan-trufflehog
        with:
          github-token: ${{ secrets.GITHUB_AUTH_TOKEN }}
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            service.name=kestra
            component=backend

      # Trivy scan of the Java dependencies on the default branch and releases/*, from the CycloneDX SBOM
      # (runtime classpath). Its own step and continue-on-error so a branch without the task doesn't fail the build.
      - name: Trivy - Generate CycloneDX
        id: sbom
        if: ${{ !cancelled() && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'releases/')) }}
        continue-on-error: true
        shell: bash
        run: ./gradlew cyclonedxBom --console=plain

      - name: Trivy - Scan Java dependencies
        id: trivy
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' && hashFiles('build/sbom/java.json') != '' }}
        uses: ./.github/actions/fork-scan-trivy
        with:
          scan-type: sbom
          scan-path: build/sbom/java.json
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            service.name=kestra
            component=backend
            target=java-dependencies

      - name: comment PR with test report
        if: "${{ github.repository == 'kestra-io/kestra' && (!cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_AUTH_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --ci $(pwd)

      - name: generate test report in logs and fail if any failed tests
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_AUTH_TOKEN }}
        run: npx --yes @kestra-io/kestra-devtools generateTestReportSummary --only-errors --fail-on-error $(pwd)

      # Report Java
      # this will add a failed check if there is tests errors
      - name: Report - Java
        uses: ./.github/actions/fork-report-java
        if: ${{ !cancelled() }}
        with:
          secrets: ${{ toJSON(secrets) }}

      # Coverage
      - name: Coverage - Report
        if: ${{ !cancelled() && env.OTLP_ENDPOINT != '' }}
        continue-on-error: true
        uses: ./.github/actions/fork-report-coverage
        with:
          github-token: ${{ secrets.GITHUB_AUTH_TOKEN }}
          coverage-files: '**/build/reports/jacoco/**/*.xml'
          component: backend
          elastic-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          elastic-headers: "${{ secrets.OTLP_HEADERS }}"
          metadata: |
            service.name=kestra
            component=backend
      - name: Preserve fork test reports
        if: ${{ always() && github.repository != 'kestra-io/kestra' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-backend-test-reports
          path: "**/build/test-results/test/TEST-*.xml"
          if-no-files-found: ignore
